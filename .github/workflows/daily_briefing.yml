name: Techmeme Daily Slovak Audio

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Krok 1 - Stiahnutie repozitara
      uses: actions/checkout@v4

    - name: Krok 2 - Nastavenie Pythonu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Krok 3 - Instalacia kniznic
      run: pip install --upgrade google-genai beautifulsoup4

    - name: Krok 4 - Spustenie generovania audia
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      run: python main.py
